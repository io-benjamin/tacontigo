<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0A2342" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon-16x16.png" />
    <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <title>Tacontigo · Tacos that go where you go</title>
    <meta name="description" content="Family recipes from Guadalajara: tacos, tortas, burritos and more, made fresh every day in Chester, VA. Order ahead, or let us cater your party." />

    <!-- Link previews (iMessage, Facebook, Instagram, X, Slack). Image URLs must be absolute. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tacontigo" />
    <meta property="og:url" content="https://rvatacontigo.com/" />
    <meta property="og:title" content="Tacontigo · Tacos that go where you go" />
    <meta property="og:description" content="Family recipes from Guadalajara · Chester, VA. Order ahead, or let us cater your party." />
    <meta property="og:image" content="https://rvatacontigo.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tacontigo: Tacos that go where you go. An order receipt with a photo of asada, pastor and pollo tacos, stamped ¡Pásele, pásele!" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tacontigo · Tacos that go where you go" />
    <meta name="twitter:description" content="Family recipes from Guadalajara · Chester, VA." />
    <meta name="twitter:image" content="https://rvatacontigo.com/og-image.jpg" />
  </head>
  <body>
    <form name="catering-request" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" style="display:none;">
      <input type="hidden" name="form-name" value="catering-request" />
      <p>
        <label>Don’t fill this out if you’re human: <input name="bot-field" /></label>
      </p>

      <!-- Expected form fields (registered at build time) -->
      <input type="hidden" name="name" value="" />
      <input type="hidden" name="email" value="" />
      <input type="hidden" name="phone" value="" />
      <input type="hidden" name="event-date" value="" />
      <input type="hidden" name="special-requests" value="" />
      <input type="hidden" name="order-details" value="" />
      <input type="hidden" name="total-price" value="" />
    </form>

    <div id="root"></div>
  </body>
</html>
